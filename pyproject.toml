[project]
name = "voice-order-agent"
version = "0.0.0"
description = "A voice agent that takes product orders over the phone."
requires-python = ">=3.11"

# Deliberately thin, and no database server: storage is stdlib sqlite3.
# Dependencies are added at the stage that needs them, so a broken install
# always points at one stage. See docs/ARCHITECTURE.md.
dependencies = [
    "pyyaml>=6.0",          # stage 0 - config
    "requests>=2.31",       # stage 1 - streaming the catalog
    "numpy>=1.26",          # stage 2 - vector search is a matmul
]

[project.optional-dependencies]
# stage 2 - retrieval
retrieval = [
    "bm25s>=0.2",             # in-process BM25, same scores everywhere
    "sentence-transformers>=3.0",
    "metaphone>=0.6",         # stage 5 - phonetic part-number matching
]
# stages 4, 7 - speech
speech = [
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
    "soundfile>=0.12",
    "jiwer>=3.0",             # WER
]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
voice-order = "voice_order.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["voice_order*"]

[tool.setuptools.package-data]
voice_order = ["db/*.sql"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
