[project]
name = "voice-order-agent"
version = "0.0.0"
description = "A voice agent that takes product orders over the phone."
requires-python = ">=3.11"

# Deliberately thin, and no database server: storage is stdlib sqlite3.
# Dependencies are added at the stage that needs them, so a broken install
# always points at one stage. See docs/ARCHITECTURE.md.
dependencies = [
    "pyyaml>=6.0",          # stage 0 - config
    "numpy>=1.26",          # stage 2 - vector search is a matmul
    # stage 1 streams the catalog over stdlib urllib -- no requests needed
]

[project.optional-dependencies]
# stage 2 - retrieval
retrieval = [
    "bm25s>=0.2",             # in-process BM25, same scores everywhere
    # fastembed runs bge-small-en-v1.5 on ONNX Runtime. sentence-transformers
    # would pull a multi-hundred-MB torch wheel for a 33M-parameter model, and
    # install weight is a real cost for something meant to be forked and run.
    "fastembed>=0.4",
    "metaphone>=0.6",         # stage 5 - phonetic part-number matching
]
# stages 4, 7 - speech
speech = [
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
    "soundfile>=0.12",        # FLAC read/write
    "scipy>=1.11",            # resampling and the phone band-pass
    "jiwer>=3.0",             # WER
]
# No ffmpeg. The phone codec is numpy + scipy, so there is no system
# dependency to install and the output is identical on every platform.
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
voice-order = "voice_order.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["voice_order*"]

[tool.setuptools.package-data]
voice_order = ["db/*.sql"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "W", "B", "SIM", "C4", "I"]
ignore = [
    # Would flatten readable multi-line word lists into 400-character literals.
    "SIM905",
    # Nested ifs are often clearer than a compound condition here.
    "SIM102",
    # `_is_identifier_shaped` is a sequence of guard clauses; collapsing the
    # last one into `return not ...` would make it read differently from the
    # five rejections above it.
    "SIM103",
    # Explicit if/else beats a ternary when the branches carry comments.
    "SIM108",
    # Nested `with` blocks are kept where a comment separates them.
    "SIM117",
]

[tool.ruff.lint.per-file-ignores]
# web.py embeds a page as a string literal. Wrapping CSS selectors and JS to
# fit a Python line limit makes them harder to read, not easier.
"voice_order/web.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
