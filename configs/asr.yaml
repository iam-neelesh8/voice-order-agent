# Stage 4 — speech in.

model:
  name: small.en           # faster-whisper size
  device: cpu              # cpu | cuda
  compute_type: int8

decode:
  beam_size: 5
  # Biases Whisper toward writing part numbers as digits rather than spelling
  # them out. Measured +11.2 points of identifier recovery on the dev phone
  # set -- larger than the spoken-digit normaliser and larger than upgrading
  # small.en to large-v3. It stops the worst failure: a code written as a
  # cardinal number ("five hundred thirty two thousand...") that no downstream
  # rule can recover. Capped at ~224 tokens, so it is a style hint, not a
  # vocabulary. See docs/LEARNINGS.md.
  initial_prompt: >-
    Ordering auto parts by part number. Examples: 41-993, P0420, AV1200,
    3397118933, F4ZZ-2B293-A, H9004S, 8542043983.
  # n-best is the whole point — one transcript is not enough for part numbers.
  n_best: 5
  temperature: 0.0
  vad_filter: true
  language: en

# Stage 4 — how the spoken test set is built.
synthesis:
  engine: piper
  # 4+, or this measures one speaker rather than the ASR. Two accents on
  # purpose: en_GB voices are the closest free proxy for the accent spread
  # the stage 8 human recordings are meant to check.
  voices:
    - en_US-lessac-medium
    - en_US-amy-medium
    - en_US-ryan-medium
    - en_GB-alan-medium
    - en_GB-cori-medium
  out_dir: data/audio/synthetic
  # Piper is stochastic by default -- VITS samples a duration predictor, so
  # the same sentence twice yields different audio and there is no seed to
  # set. This zeroes the noise scales, which removes the sampling and makes
  # the spoken set genuinely regenerable. Costs some prosodic variation;
  # the five voices above supply speaker variety instead.
  deterministic: true
  # Lossless, and roughly half the size of wav. 2,000 clips x 5 conditions is
  # the difference between a set you can upload to a GPU box and one you cannot.
  format: flac

degradation:
  # G.711: 300-3400 Hz passband, 8 kHz, 8-bit mu-law. Implemented in numpy,
  # not ffmpeg -- see voice_order/evaluation/degrade.py for why.
  # Clean audio is kept too; the clean-vs-phone gap is itself a result.
  phone:
    sample_rate: 8000
    passband: [300, 3400]
  noise:
    # Synthesised, not MUSAN. MUSAN is an 11 GB single tarball with no subset,
    # which is a poor trade for a repo whose point is that it clones and runs.
    # Babble is built from the test set's own clips -- the hardest case for
    # ASR, because the interference has speech statistics.
    kinds: [babble, pink, hum]
    snr_db: [20, 10, 5]
  seed: 20260826

# The conditions the spoken set is rendered in. Each is a separate eval run.
conditions:
  - clean            # no degradation -- the ceiling
  - phone            # G.711 only, quiet line
  - phone_snr20      # light background
  - phone_snr10      # realistic call
  - phone_snr5       # bad call
