# Stages 2 and 5 -- the retrieval core.
#
# Every retriever here runs in-process against files under data/index/.
# Nothing queries the database at search time. See voice_order/db/schema.sql
# for why.

lexical:
  backend: bm25s           # in-process BM25; identical scores on every machine
  k1: 1.2
  b: 0.75
  top_k: 50

dense:
  # MEASURED, do not re-enable on intuition: fusing dense with BM25 costs 8.4
  # points of recall@1 on the dev order set (0.576 -> 0.492). Dense scores
  # 0.006 on bare part numbers, and RRF being rank-based means a retriever
  # that is near-random on identifier queries drags the fused ranking down.
  # It helps only on the two vaguest rungs. See data/README.md.
  model: BAAI/bge-small-en-v1.5
  dim: 384
  # Brute-force cosine over one numpy array. 100k x 384 float32 is ~150 MB;
  # a full scan is a single matmul. Add an ANN index at ~1M vectors, not here.
  backend: numpy
  normalise: true          # store L2-normalised so cosine is a dot product
  top_k: 50
  batch_size: 128
  # ONNX Runtime intra-op threads. null = library default, which measured
  # slower than setting it explicitly. Embedding 100k titles is ~3 hours on a
  # 14-core laptop and about a minute on a T4 -- this is the one step in the
  # project actually worth borrowing a GPU for.
  threads: 14

part_number:
  # Stage 5. Off for the stage 2/4 baseline, then each piece enabled
  # separately so the ablation can attribute the win.
  # MEASURED on the dev set, phone condition, small.en, recall@1 on queries
  # carrying an identifier: 0.226 baseline -> 0.328 with this on. It is the
  # single largest win in the project, ahead of upgrading small.en to
  # large-v3 (+0.048 on the same slice, for 4.4 GPU-hours).
  enabled: true
  normalise_spoken_digits: true   # "forty one dash nine ninety three" -> 41-993
  strip_separators: true          # 41-993 == 41 993, but AC41993 stays distinct
  phonetic: metaphone             # metaphone | soundex | none
  max_edit_distance: 1

fusion:
  method: rrf              # reciprocal rank fusion -- scores are not comparable
  rrf_k: 60
  weights: {lexical: 1.0, dense: 1.0, part_number: 1.5}
  top_k: 20

nbest:
  # Stage 5. Retrieve over every ASR hypothesis, not just the top one.
  # With this off, search_transcript reduces exactly to searching 1-best --
  # the same code path, which is what makes the ablation trustworthy.
  #
  # ONLY USEFUL ALONGSIDE part_number. Measured on the dev set, recall@1:
  #
  #   lexical only              0.212
  #   + n-best only             0.180   <- worse
  #   + part_number             0.263
  #   + part_number + n-best    0.264   (0.328 -> 0.352 on identifier queries)
  #
  # On its own it hurts: four wrong transcripts outvote one right one under
  # rank-based fusion. It pays off only next to a retriever that turns a single
  # correct hypothesis into a definitive hit, which exact identifier matching
  # is and BM25 is not.
  enabled: true
  max_hypotheses: 5
  weight_by_asr_score: true
